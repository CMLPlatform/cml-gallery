version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # NOTE: @astrojs/check 0.9.x peers on typescript ^5 || ^6, so a TS 7 bump
      # fails npm ci. Drop this once astro-check accepts TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 3
