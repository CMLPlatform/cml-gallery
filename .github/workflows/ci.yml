name: CI

on:
  push:
    branches: [ main ]
  pull_request:


permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:coverage
      # Builds too, so a fault outside the schema (a broken path, say) fails the PR
      # instead of the deploy on main.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Accessibility (axe, WCAG 2.2 AA, light and dark)
        run: |
          npx astro preview --port 4321 &
          for _ in $(seq 30); do curl -sf http://localhost:4321/cml-gallery/ >/dev/null && break; sleep 1; done
          npm run test:a11y
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
