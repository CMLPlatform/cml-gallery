name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run test:coverage
      # Builds too, so a fault outside the schema (a broken path, say) fails the PR
      # instead of the deploy on main.
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Accessibility (axe, WCAG 2.2 AA, light and dark)
        run: |
          pnpm exec astro preview --port 4321 &
          for _ in $(seq 30); do curl -sf http://localhost:4321/cml-gallery/ >/dev/null && break; sleep 1; done
          pnpm run test:a11y
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
